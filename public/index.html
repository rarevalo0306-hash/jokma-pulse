<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jokma Pulse</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pulse-tema");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
            return;
          }
        } catch (error) {}
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/pulse.css?v=20261101-navy" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/app.js?v=20261101-navy"></script>
  </body>
</html>
