<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jokma Pulse</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pulse-tema");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
            return;
          }
        } catch (error) {}
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/pulse.css?v=20261101-people" />
  </head>
  <body>
    <div id="app">
      <header class="lockup boot-brand">
        <img class="logo logo-on-light" src="/jokma-logo.svg?v=20261101-gap" alt="" />
        <img class="logo logo-on-dark" src="/jokma-logo-on-dark.svg?v=20261101-gap" alt="" />
        <span class="pulse-name"><span class="sr-only">Jokma </span><span class="pulse-word">Pulse</span><svg class="pulse-mark" viewBox="0 0 120 36" aria-hidden="true" focusable="false"><path class="beat beat-lub" fill="none" stroke="#23D8BD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" d="M2 20 H24 L30 24 L38 6 L46 30 L52 20"/><path class="beat beat-dub" fill="none" stroke="#23D8BD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" d="M52 20 H60 C68 20 72 13 80 13 C88 13 92 20 98 20"/><path class="beat beat-rest" fill="none" stroke="#23D8BD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" d="M98 20 H118"/></svg></span>
      </header>
    </div>
    <script src="/app.js?v=20261101-people"></script>
  </body>
</html>
