<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jokma Pulse</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pulse-tema");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
            return;
          }
        } catch (error) {}
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/pulse.css?v=20261101-gap" />
  </head>
  <body>
    <div id="app">
      <header class="lockup boot-brand">
        <img class="logo logo-on-light" src="/jokma-logo.svg?v=20261101-gap" alt="" />
        <img class="logo logo-on-dark" src="/jokma-logo-on-dark.svg?v=20261101-gap" alt="" />
        <span class="pulse-name"><span class="sr-only">Jokma </span><span class="pulse-word">Pulse</span><svg class="pulse-mark" viewBox="0 0 64 32" aria-hidden="true" focusable="false"><path pathLength="100" d="M2 18 H16 L24 18 L32 6 L40 26 L46 18 H62" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </header>
    </div>
    <script src="/app.js?v=20261101-gap"></script>
  </body>
</html>
